[pytest]
# Bot tests + tests quant racine (DSR, reality check, cost model, stress, WFA).
# Le test_fourier_flatness demande `scripts.fourier_core` non livré — on l'ignore.
testpaths = binance_bot/tests tests
addopts = -v --ignore=tests/test_fourier_flatness.py
filterwarnings =
    ignore::DeprecationWarning

# R-FIX-FORGE — Markers legacy.
# "slow" = tests legacy lents (ACO, alpha backtest, regime LGBM old) qui
# timeout sur Forge. Forge doit run avec : `pytest -m "not slow"`.
# Le suite "non slow" valide tous les chunks P0bis-P12 sous 60s.
markers =
    slow: tests legacy lents (>30s) à exclure de Forge — voir BUG-PRE-001
