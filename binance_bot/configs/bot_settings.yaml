# Paramètres opérationnels du bot Binance — multi-symbole 2026-04-27
# Règle dimensionnement: notional = initial_capital × position_size_pct × leverage_du_symbole
# Règle positions: par symbole, max 3 LONG OU 3 SHORT (jamais mixte). Worst-case 9 positions sur 3 cryptos.
symbols:
  - { pair: "BTC/USDT", leverage: 125 }   # max testnet
  - { pair: "ETH/USDT", leverage: 100 }   # max testnet pour ce compte
  - { pair: "SOL/USDT", leverage: 50 }    # max testnet
timeframe: "2h"
position_size_pct: 0.01   # 1% du capital par trade ($1 marge sur $100)
max_positions_per_symbol: 3   # 3 LONG XOR 3 SHORT par symbole (pas mixé)

# P1 (2026-04-28) — Daily caps soft/hard sur PnL signed du jour (% capital).
# - Soft caps : flat toutes les positions internes + bloque nouvelles entrées
#   jusqu'au prochain 00:00 UTC. Sorties TP/SL/trailing restent actives.
# - Hard cap (loss only) : déclenche kill_switch + alerte Telegram CRITICAL +
#   freeze jusqu'à audit manuel (rm data/.killed).
# Mettre 0 pour désactiver un seuil.
daily_loss_soft_cap_pct: 0.02   # -2% : flat + block until next UTC midnight
daily_gain_soft_cap_pct: 0.03   # +3% : flat + block (cap rémunération discipline)
daily_loss_hard_cap_pct: 0.10   # -10% : kill switch + freeze
max_portfolio_risk: 0.06        # P0 : budget sigma_pf agrégé multi-symbole
portfolio_var_threshold: 0.08   # P3 : VaR95 24h seuil — bloque entrées au-dessus

# P7 / R5 — VPIN gate (Easley-LdP-O'Hara 2012) — Option A reset-wins state machine.
# Mode log_only par défaut : aucun blocage, juste collecte baseline 30j dans
# data/vpin_events.jsonl. Après baseline + validation Sky, passer mode="gate".
vpin_mode: "log_only"            # "log_only" | "gate"
vpin_block_threshold: 0.70       # block new entries au-dessus de ce VPIN
vpin_kill_threshold: 0.85        # kill (flat all) si VPIN > ET OBI < kill_obi
vpin_kill_obi_threshold: 0.30    # OBI seuil sous lequel cascade imminente
vpin_reset_threshold: 0.50       # hystérésis : block lifted dès que VPIN passe sous
vpin_block_duration_minutes: 15  # plafond safety du block (failsafe, reset gagne)

# P7-bis (R-mission autonome 2026-04-28) — collecteur VPIN live
# (aggTrade replaced by @trade per WS-001, + @bookTicker pour OBI).
# 2026-04-29 ACTIVATED : daemon hsbc-vpin-live.service running.
vpin_collector_enabled: true
# Bucket sizes auto-calculées au premier lancement (klines daily 7d / 50,
# Easley 2012 V/N). Recomputed si > 7j stale.
vpin_bucket_size_usdt:
  BTCUSDT: 157881520.90919915
  ETHUSDT: 123136154.96258992
  SOLUSDT: 22677104.75220571
vpin_bucket_size_last_compute_iso: '2026-04-29T03:29:31.241065+00:00'

# P11 / R9 — Funding-aware close (Binance Futures settlement HH:00 UTC).
# Runner hsbc-funding-close.timer fires HH:55-59 pour HH ∈ {0,8,16}.
# Si la position courante a un funding adverse > threshold, flat avant settlement.
funding_close_threshold_long_bps: 5.0    # close LONG si funding > +5 bps
funding_close_threshold_short_bps: 5.0   # close SHORT si funding < -5 bps
funding_close_advance_minutes: 5         # fenêtre [HH:55, HH:60) de check

# P5 — PSR live alpha decay detection (PSR-001 branchement systemd 2026-04-30)
# Lu par scripts/production/psr_live_daily.py (cron via hsbc-psr.timer 23:50 UTC).
psr_benchmark_sr: 1.0                    # Sharpe benchmark NON annualisé à dépasser
psr_min_track_record_length: 15          # min returns pour PSR significatif (Bailey-LdP MinTRL)

# P-MTF (mission multi-TF) — exécution 15m indexée tendance H2
# H2 = filtre directionnel (params Ichimoku via phase K3 → params_today)
# 15m = déclencheur d'entrée (params dédiés, plus courts)
multi_tf_enabled: true                   # false = mode legacy mono-H2 (intraday seul)
params_15m:                              # P-MTF-8 : params Ichimoku 15m
  tenkan: 9                              # plus court que H2 (H2 phase 2 = 21)
  kijun: 26                              # standard Ichimoku 15m
  senkou_b: 52                           # standard Ichimoku 15m
  shift: 26                              # standard Ichimoku 15m
  atr_mult: 5.0                          # SL plus serré que H2 (H2 phase 2 = 10.5)
  tp_mult: 3.0                           # TP plus serré (R:R ~1:3 à 1:1.5)
h2_trend_max_age_hours: 3.0              # skip exec si H2 trend > N heures
h2_trend_margin_pct: 0.0                 # marge prix vs nuage (0 = strict)
flat_eod_enabled: true                   # P-MTF-9 : flat all à HH:23:45 UTC
flat_eod_minute_utc: 45                  # minute UTC du flat EOD (default 23:45 UTC)

# Compat ascendant (utilisé seulement si settings.symbols absent)
symbol: "BTC/USDT"
max_leverage: 125
max_positions_per_side: 3
stop_global_equity: 0.50   # equity minimale (50% du capital initial)
slippage_bps: 5            # slippage par défaut (0.05%)
atr_period: 14
atr_trailing_multiplier: 2.0
log_file: "logs/bot.log"
state_file: "data/state.json"

# Régime filter ER+ADX (ALPHA-1, recommandation P1 audit quant 2026-04-26).
# Désactivé par défaut — activer après validation empirique par WFA + Hansen SPA.
# Quand enabled, les entrées Ichimoku sont bloquées si ER<min_er OU ADX<min_adx
# (i.e. marché en range). Les sorties (TP/SL/trailing) restent actives.
regime_filter:
  enabled: false
  min_er: 0.30
  min_adx: 22.0
  er_period: 30
  adx_period: 14

# trade_mode: "simulation" (no-op) ou "live" (place réellement sur l'exchange).
# DEFAULT = simulation (safety). Override via env var TRADE_MODE=live ou
# en éditant cette ligne explicitement avant un run live.
# IMPORTANT: avec BINANCE_TESTNET=true dans .env, "live" trade sur testnet
# (capital fictif). Avec BINANCE_TESTNET=false, ça part sur mainnet → vrai capital.
trade_mode: "simulation"
